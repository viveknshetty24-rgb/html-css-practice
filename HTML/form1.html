<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>from</title>
</head>

<body>
     <h1>Basic Registration form</h1>
     <form>
          <div>
               <label for="username"></label>
               Name:<input type="text" id="username" placeholder="Enter your Name">
          </div>
          <div>
               <label for="age"></label>
               Age:<input type="number" id="age" placeholder="Enter your Age(1-100)">
          </div>
          <div>
               <label for="phone"></label>
               Contact:<input type="number" id="phone" placeholder="Contact No">
          </div>
          <div>
               <label for="address">Address:
               </label>
               <textarea id="address" placeholder="Enter your adress"></textarea>
          </div>
          <div>
            <button type="Submit">Submit</button>
          </div>
     </form>
</body>

</html>
